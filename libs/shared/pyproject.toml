[project]
name = "pr-review-shared"
version = "0.1.0"
description = "Shared schemas, DB models, and config for the AI-Powered PR Review Assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_review_shared"]

[project]
name = "pr-review-webhook-gateway"
version = "0.1.0"
description = "FastAPI gateway that verifies GitHub/GitLab webhooks and starts PRReviewWorkflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "temporalio>=1.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pr-review-shared",
]

[tool.uv.sources]
pr-review-shared = { path = "../../libs/shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

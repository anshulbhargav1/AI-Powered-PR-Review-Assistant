[project]
name = "pr-review-worker"
version = "0.1.0"
description = "Temporal worker: PRReviewWorkflow, review agents, VCS/LLM/DB activities"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9",
    "groq>=0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "langgraph>=0.2",
    "pr-review-shared",
]

[tool.uv.sources]
pr-review-shared = { path = "../../libs/shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
